<!doctype html>
<html lang="vi-VN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f8f5ee">
    <meta name="description" content="Huấn luyện viên Calisthenics lưu cục bộ, nhật ký tập luyện và theo dõi tiến trình.">
    <title>Kineto Calisthenics</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
  </head>
  <body>
    <a class="skip-link" href="#app-view">Chuyển đến ứng dụng</a>
    <div id="app" class="app-shell" data-theme="light">
      <aside id="app-nav" class="app-nav" aria-label="Điều hướng chính"></aside>
      <main class="app-main">
        <header class="topbar">
          <div>
            <p class="eyebrow">Tập luyện lưu cục bộ</p>
            <h1 id="page-title">Kineto</h1>
          </div>
          <button class="icon-button" type="button" data-action="toggle-theme" aria-label="Đổi giao diện sáng/tối" title="Đổi giao diện sáng/tối">
            <span aria-hidden="true">◐</span>
          </button>
        </header>
        <section id="app-view" class="view" tabindex="-1" aria-live="polite"></section>
      </main>
    </div>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <div id="modal-root" class="modal-root" aria-live="polite"></div>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js" defer></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
